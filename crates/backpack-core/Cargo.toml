[package]
name = "backpack-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
json5 = "0.4"
toml_edit = "0.22"
sha2 = "0.10"
url = "2"
tempfile = "3"
jsonc-parser = { version = "0.32", features = ["cst"] }
dirs = "6"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "sync", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
